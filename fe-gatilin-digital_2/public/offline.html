<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0812">
  <title>Sin conexión · Gatilín Digital</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c0812; color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 1.5rem; margin: 16px 0 8px; }
    p { color: rgba(255,255,255,.65); max-width: 26rem; line-height: 1.5; margin: 0 auto; }
    .acciones { margin-top: 24px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    a, button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.06); color: #fff; text-decoration: none; cursor: pointer; }
    button { background: #f2c14e; color: #0c0812; border: 0; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>Estás sin conexión</h1>
    <p>No pudimos cargar esta página. Las secciones que ya visitaste (agenda, festival, cofradías) siguen disponibles sin internet.</p>
    <div class="acciones">
      <button type="button" onclick="location.reload()">Reintentar</button>
      <a href="/agenda">Ver agenda guardada</a>
      <a href="/festival">Ver festival</a>
    </div>
  </main>
</body>
</html>
